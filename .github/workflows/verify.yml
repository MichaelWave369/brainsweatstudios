name: Gameplay browser checks

on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve full-game evidence while interface/service follow-ups run separately.
  group: browser-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run lint && npm run test && npm run build
      - name: Headless determinism and performance sweep
        run: npm run test:headless
      - name: Verify WebKit connected phone navigation
        run: npm run test:e2e -- tests/e2e/online-features.spec.ts --project=webkit --workers=2
        env:
          CROSS_BROWSER: 1
          TEST_PRODUCTION: 1
          ONLINE_TEST_SERVER: 1
      - name: Verify agent academy in three browsers
        run: npm run test:e2e -- tests/e2e/academy-features.spec.ts --workers=3
        env:
          CROSS_BROWSER: 1
          TEST_PRODUCTION: 1
      - name: Verify runtime experiments in three browsers
        run: npm run test:e2e -- tests/e2e/runtime-features.spec.ts --workers=3
        env:
          CROSS_BROWSER: 1
          TEST_PRODUCTION: 1
      - name: Repeat paused experiment persistence in WebKit
        run: npm run test:e2e -- tests/e2e/runtime-features.spec.ts --project=webkit --grep 'experiments separate splits' --repeat-each=10 --workers=3
        env:
          CROSS_BROWSER: 1
          TEST_PRODUCTION: 1
      - name: Agent gameplay and cross-browser accessibility
        run: |
          studio_ui_only=0
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            studio_changed_files=$(git diff --name-only HEAD^ HEAD)
            command -v grep >/dev/null
            if ! printf '%s\n' "$studio_changed_files" | grep -Eqv '^(src/app/(Academy|Assistant|Online|RetroLab)\.tsx|src/styles/(academy|studio)\.css|src/i18n/(academy|es|rung4)\.json|src/data/rungFourClasses\.ts|src/online/.*\.ts|tests/online\.test\.ts|tests/e2e/(accessibility|localization|academy-features|advanced-features|rung4-features|online-features)\.spec\.ts|\.github/workflows/(verify|deploy)\.yml|README\.md|docs/.*)$'; then
              studio_ui_only=1
            fi
          fi
          if [ "$studio_ui_only" = "1" ]; then
            npm run test:e2e -- --workers=3 --grep-invert 'agent:|academy:|runtime:'
          else
            npm run test:e2e -- --workers=3 --grep-invert 'academy:|runtime:'
          fi
        env:
          BOT_FULL_SWEEP: 1
          CROSS_BROWSER: 1
          TEST_PRODUCTION: 1
          ONLINE_TEST_SERVER: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
