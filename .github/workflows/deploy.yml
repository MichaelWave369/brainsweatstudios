name: Verify and deploy Brain Sweat Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint and test game systems
        run: npm run lint && npm run test
      - name: Build Pages app
        run: npm run build
        env:
          VITE_BASE_PATH: /brainsweatstudios/
      - run: npx playwright install --with-deps chromium
      - name: Verify returning-player upgrades and offline play
        run: |
          legacy_upgrade_dir="$RUNNER_TEMP/studio-upgrade-v1"
          before_upgrade_dir="$RUNNER_TEMP/studio-upgrade-before-fix"
          mkdir -p "$legacy_upgrade_dir" "$before_upgrade_dir"
          git archive b8660fe3222f27888f1a5fcd7c8b4421be72b86f | tar -x -C "$legacy_upgrade_dir"
          git archive 064551a2cf71595ba05978605fdcd49d102aa0da | tar -x -C "$before_upgrade_dir"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$legacy_upgrade_dir/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$before_upgrade_dir/node_modules"
          npm run build --prefix "$legacy_upgrade_dir"
          npm run build --prefix "$before_upgrade_dir"
          LEGACY_DIST="$legacy_upgrade_dir/dist" CURRENT_DIST="$before_upgrade_dir/dist" REPRODUCE_STALE=1 node scripts/verify-upgrade.mjs
          LEGACY_DIST="$legacy_upgrade_dir/dist" node scripts/verify-upgrade.mjs
          node scripts/verify-production.mjs
      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the published studio
        run: node scripts/verify-live.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-studio-screenshot
          path: docs/screenshots/live-v2.png
          retention-days: 14
