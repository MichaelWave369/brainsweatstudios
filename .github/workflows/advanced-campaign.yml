name: Advanced campaign checks
on:
  pull_request:
    paths:
      - 'src/circuit/**'
      - 'src/app/Circuit*.tsx'
      - 'src/styles/circuit.css'
      - 'src/i18n/circuit.json'
      - 'tests/circuit.test.ts'
      - 'tests/e2e/circuit-features.spec.ts'
      - 'scripts/circuit.mjs'
      - 'scripts/test-circuit.mjs'
      - 'src/career/**'
      - 'src/families/**'
      - 'src/performance/**'
      - 'src/app/Performance*.tsx'
      - 'src/i18n/performance.json'
      - 'tests/performance.test.ts'
      - 'tests/fixtures/v10-family-receipts.json'
      - 'tests/e2e/performance-features.spec.ts'
      - 'src/app/FamilyTelemetry.tsx'
      - 'src/i18n/families.json'
      - 'tests/families.test.ts'
      - 'tests/family-career.test.ts'
      - 'tests/e2e/family-features.spec.ts'
      - 'src/app/AgentLocker.tsx'
      - 'src/styles/career.css'
      - 'src/i18n/career.json'
      - 'tests/e2e/career-features.spec.ts'
      - '.github/workflows/advanced-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: advanced-campaign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build && npm run test:career && npm run test:families && npm run test:circuit
      - name: Verify scoped identity and evidence in three browsers
        run: npm run test:e2e -- tests/e2e/career-features.spec.ts tests/e2e/family-features.spec.ts tests/e2e/performance-features.spec.ts tests/e2e/circuit-features.spec.ts --workers=3
        env:
          CROSS_BROWSER: 1
          TEST_PRODUCTION: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-browser-failures
          path: test-results
          retention-days: 7
