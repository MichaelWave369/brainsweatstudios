name: Full live release verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-live-release
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the heavyweight published-studio verifier
        run: node scripts/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-live-verification
          path: |
            docs/screenshots/live-v*.png
            test-results
          retention-days: 14
